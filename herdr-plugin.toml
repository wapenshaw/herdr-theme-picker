id = "herdr-theme-picker"
name = "Theme Picker"
version = "0.10.0"
min_herdr_version = "0.8.0"
description = "Pick any terminalcolors.com theme and apply it to Herdr's UI via [theme.custom]."
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["go", "build", "-o", "herdr-theme-picker", "./cmd/herdr-theme-picker"]

[[build]]
platforms = ["windows"]
command = ["go", "build", "-o", "herdr-theme-picker.exe", "./cmd/herdr-theme-picker"]

[[panes]]
id = "picker"
title = "Theme Picker"
placement = "popup"
width = "80%"
height = "70%"
command = ["./herdr-theme-picker", "picker"]

[[actions]]
id = "open"
title = "Theme picker: open"
contexts = ["workspace"]
command = ["./herdr-theme-picker", "open"]

[[actions]]
id = "sync"
title = "Theme picker: sync terminal colors"
contexts = ["global"]
command = ["./herdr-theme-picker", "sync"]

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"
description = "pick a color theme"
